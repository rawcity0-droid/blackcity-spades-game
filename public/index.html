<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d38">
<title>Blackcity Spades</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <header id="topbar">
      <div id="scores"></div>
      <div id="target-label"></div>
      <div id="top-actions"></div>
    </header>
    <div id="board"></div>
    <div id="status"></div>
    <div id="handzone"></div>
    <div id="footbar"><span id="conn" class="conn"><i></i><b>Connecting…</b></span></div>
  </div>
  <div id="home-layer" class="layer-home hidden"></div>
  <div id="sheet-layer" class="sheet-layer hidden"></div>
  <div id="auto-layer"></div>
  <div id="modal-layer"></div>
  <div id="toast" class="toast hidden" role="status"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
