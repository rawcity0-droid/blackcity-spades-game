<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d38">
<title>Blackcity Spades</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BC Spades">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <header id="topbar">
      <div id="scores"></div>
      <div id="target-label"></div>
      <div id="top-actions"></div>
    </header>
    <div id="board"></div>
    <div id="status"></div>
    <div id="handzone"></div>
    <div id="footbar">
      <div id="dock">
        <button id="back-btn" class="dock-btn back hidden" type="button" aria-label="Back to the menu" title="Back"></button>
        <button id="music-btn" class="dock-btn hidden" type="button" aria-pressed="false" aria-label="Table music" title="Table music"></button>
        <input id="music-vol" class="vol hidden" type="range" min="0" max="100" step="5" aria-label="Music volume">
        <button id="chat-btn" class="dock-btn chat hidden" type="button" aria-expanded="false" aria-controls="chat-sheet" aria-label="Table chat"></button>
      </div>
      <span id="conn" class="conn"><i></i><b>Connecting…</b></span>
    </div>
  </div>
  <section id="chat-sheet" class="chat-sheet hidden" role="dialog" aria-label="Table chat"></section>
  <div id="home-layer" class="layer-home hidden"></div>
  <div id="sheet-layer" class="sheet-layer hidden"></div>
  <div id="auto-layer"></div>
  <div id="modal-layer"></div>
  <div id="toast" class="toast hidden" role="status"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
