<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c26">
<title>Blackcity Spades</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-mark">&#9824;</span> Blackcity Spades</div>
    <div id="who"></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main">
    <section id="screen-nick" class="screen"></section>
    <section id="screen-lobby" class="screen hidden"></section>
    <section id="screen-table" class="screen hidden"></section>
    <section id="screen-tournament" class="screen hidden"></section>
  </main>
  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden" role="status"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
